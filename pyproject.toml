[project]
name = "dl-alchemy"
version = "0.1.0"
description = "CS312 Deep Learning Alchemy pretraining playground."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "huggingface-hub",
    "matplotlib",
    "modal>=1.5.3",
    "numpy",
    "requests",
    "sentencepiece",
    # Triton imports setuptools during backend discovery; without it,
    # torch.compile(mode="reduce-overhead") fails on Modal.
    "setuptools",
    "torch==2.6.0",
    "tqdm",
    "wandb>=0.19",
]

[tool.uv]
package = false
